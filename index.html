<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gain Tracker</title>
<style>
:root{--bg:#f2f3f7;--card:#fff;--text:#14171f;--muted:#737b8c;--a1:#fc4c02;--a2:#10b981;--line:#e4e7ee;--bar:#e9ecf2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f14;--card:#171a22;--text:#f2f4f8;--muted:#8a93a6;--line:#262b38;--bar:#262b38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f14;--card:#171a22;--text:#f2f4f8;--muted:#8a93a6;--line:#262b38;--bar:#262b38;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 96px}
.top{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:26px;margin:4px 0;font-weight:800;letter-spacing:-.5px}
.muted{color:var(--muted);font-size:12px}
.strip{display:flex;justify-content:space-between;margin:10px 0 14px}
.strip button{background:none;border:0;color:var(--text);font:inherit;text-align:center;cursor:pointer;padding:2px}
.strip small{display:block;font-size:11px;color:var(--muted)}
.strip .sel small{color:var(--a1);font-weight:700}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.hero{display:flex;justify-content:space-around;gap:8px}
.rg{text-align:center}
.rg .c{position:relative;width:132px;height:132px;margin:auto}
.rg .c div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rg b{font-size:28px;font-weight:800;line-height:1}
.chips{display:flex;gap:8px;margin-top:12px}
.chips div{flex:1;background:var(--bg);border-radius:12px;padding:8px;text-align:center}
.chips b{display:block;font-size:16px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mh b{font-size:16px}
.done{border:1px solid var(--line);background:none;color:var(--muted);border-radius:20px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ck{flex:0 0 26px;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;color:#fff;font-size:15px;cursor:pointer;padding:0}
.ck.on{background:var(--a2);border-color:var(--a2)}
.nm{flex:1;min-width:0}
.nm small{display:block;color:var(--muted);font-size:11px}
.row.eaten .nm{opacity:.6}
.st{display:flex;align-items:center;gap:3px}
.st button,.x{width:28px;height:28px;border:0;background:var(--bg);color:var(--text);border-radius:50%;font-size:16px;cursor:pointer;padding:0}
.x{background:none;color:var(--muted);font-size:18px}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;max-width:100%}
.st input{width:46px;text-align:center;padding:4px}
select.add{width:100%;margin-top:6px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 3px;text-align:left;border-top:1px solid var(--line);font-size:13px}
td input{width:100%;min-width:0}
.scroll{overflow-x:auto}
.btn{background:var(--a1);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--bar);color:var(--text)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g3 label{font-size:12px;color:var(--muted);display:block}
.g3 input{width:100%}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:200px;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:6px;cursor:pointer;border-radius:10px}
nav button.on{color:var(--a1);font-weight:700}
nav span{display:block;font-size:20px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="muted" id="date"></div><h1 id="title"></h1></div><div class="muted" id="sync">This device only</div></div>
<div id="view"></div>
</div>
<nav><button data-v="Today"><span>●</span>Today</button><button data-v="Week"><span>▦</span>Week</button><button data-v="Foods"><span>☰</span>Foods</button></nav>
<script>

const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MEALS=["Pre-skill","Breakfast","Class break","Lunch","Big snack","Post-workout","Dinner","Bedtime"];
const FOODS=[["Banana","1 medium",90,1.1],["Bread slice","1 slice",80,2.7],["Butter","1 tsp",36,0],["Peanut butter","1 tbsp",95,4],["Jam","1 tbsp",50,0],["Almonds","10 g",58,2.1],["Peanuts","10 g",57,2.6],["Cashews","10 g",55,1.8],["Raisins","10 g",30,0.3],["Paneer","50 g",140,9],["Soya chunks, dry","50 g dry",170,26],["Cooked rice","100 g",130,2.7],["Roti","1 medium",100,3],["Dal, cooked","1 katori",150,8],["Curd","100 g",60,3.5],["Ghee","1 tsp",45,0],["Protein shake","1 scoop in water",120,24],["Cholle/Rajma, cooked","1 katori",200,10],["Watermelon","100 g",30,0.6],["Mess breakfast plate","1 plate",350,10],["Mess lunch plate","1 plate",550,18],["Mess dinner plate (veg)","1 plate",550,14],["Mess sandwich","1 sandwich",250,6]];
function mk(d){const L=[],a=(m,f,q)=>L.push({m,f,q});
a("Pre-skill","Banana",1);a("Breakfast","Mess breakfast plate",1);
if(d=="Wed")a("Breakfast","Banana",1);
if(d=="Sat")a("Breakfast","Watermelon",2);
a("Breakfast","Bread slice",d=="Sat"?4:3);a("Breakfast","Butter",1);a("Breakfast","Peanut butter",d=="Sat"?1.5:1);
a("Class break","Almonds",1);a("Class break","Peanuts",1);a("Class break","Raisins",1);
a("Lunch","Mess lunch plate",1);a("Lunch","Roti",1);a("Lunch","Ghee",1);a("Lunch","Curd",1);
if(d=="Sun"){a("Big snack","Mess sandwich",2);a("Big snack","Banana",1)}else{a("Big snack","Bread slice",3);a("Big snack","Peanut butter",1.5);a("Big snack","Banana",1)}
a("Big snack","Almonds",1);a("Big snack","Peanuts",1);
a("Post-workout","Protein shake",1);a("Post-workout","Banana",1);
if(d=="Wed"||d=="Fri"){a("Dinner","Paneer",2);a("Dinner","Roti",2);a("Dinner","Cooked rice",1);a("Dinner","Curd",1)}
else if(d=="Sun"){a("Dinner","Cooked rice",2);a("Dinner","Dal, cooked",1);a("Dinner","Curd",1);a("Dinner","Soya chunks, dry",1)}
else a("Dinner","Mess dinner plate (veg)",1);
a("Bedtime","Almonds",1);a("Bedtime","Peanuts",1);a("Bedtime","Peanut butter",1);
return L}
function defaults(){const days={};DAYS.forEach(d=>days[d]=mk(d));
return{t:{kcal:3200,protein:110,weight:51},foods:FOODS.map(f=>({n:f[0],u:f[1],k:f[2],p:f[3]})),days}}

const mon=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const wk=mon().toISOString().slice(0,10),ti=(new Date().getDay()+6)%7;
let S=defaults(),view="Today",sel=ti,ref=null,timer=null,armed=false;
try{const l=localStorage.getItem("gt");if(l)S=JSON.parse(l)}catch(e){}
function fresh(){if(S.wk!==wk){S.wk=wk;DAYS.forEach(d=>S.days[d].forEach(r=>r.d=false))}}
fresh();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const food=n=>S.foods.find(f=>f.n===n);
const kc=r=>(food(r.f)?food(r.f).k:0)*r.q,pr=r=>(food(r.f)?food(r.f).p:0)*r.q;
const tot=(d,eo)=>S.days[d].filter(r=>!eo||r.d).reduce((a,r)=>({k:a.k+kc(r),p:a.p+pr(r)}),{k:0,p:0});
const n0=x=>Math.round(x).toLocaleString(),n1=x=>(Math.round(x*10)/10).toFixed(1);
function save(){try{localStorage.setItem("gt",JSON.stringify(S))}catch(e){}
if(!ref)return;clearTimeout(timer);$("sync").textContent="Saving…";
timer=setTimeout(async()=>{try{await ref.set({json:JSON.stringify(S)});$("sync").textContent="Synced"}catch(e){$("sync").textContent="Saved on this device"}},700)}
function ring(v,t,col,r,w){const C=2*Math.PI*r,p=t>0?Math.min(v/t,1):0,s=r*2+w;
return`<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="transform:rotate(-90deg)"><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="var(--bar)" stroke-width="${w}"/><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg>`}
function dateOf(i){const d=mon();d.setDate(d.getDate()+i);return d}
function strip(){return`<div class="strip">${DAYS.map((d,i)=>{const t=tot(d,1),dt=dateOf(i);
return`<button data-a="sel" data-i="${i}" class="${i===sel?"sel":""}"><small>${d[0]}</small><span style="position:relative;display:inline-block;width:40px;height:40px">${ring(t.k,S.t.kcal,i===sel?"var(--a1)":"var(--a2)",16,4)}<b style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px">${dt.getDate()}</b></span></button>`}).join("")}</div>`}
function todayView(){const d=DAYS[sel],t=tot(d,1),pl=tot(d),rows=S.days[d];
let h=strip()+`<div class="card"><div class="hero">
<div class="rg"><div class="c">${ring(t.k,S.t.kcal,"var(--a1)",58,10)}<div><b>${n0(t.k)}</b><span class="muted">of ${n0(S.t.kcal)} kcal</span></div></div></div>
<div class="rg"><div class="c">${ring(t.p,S.t.protein,"var(--a2)",58,10)}<div><b>${n1(t.p)}</b><span class="muted">of ${n0(S.t.protein)} g protein</span></div></div></div></div>
<div class="chips"><div><b>${t.k>=S.t.kcal?"+"+n0(t.k-S.t.kcal):n0(S.t.kcal-t.k)}</b><span class="muted">${t.k>=S.t.kcal?"kcal over":"kcal left"}</span></div>
<div><b>${t.p>=S.t.protein?"+"+n1(t.p-S.t.protein):n1(S.t.protein-t.p)}</b><span class="muted">${t.p>=S.t.protein?"g over":"g left"}</span></div>
<div><b>${n0(pl.k)}</b><span class="muted">planned kcal</span></div></div></div>`;
MEALS.forEach(m=>{const it=rows.map((r,i)=>({r,i})).filter(x=>x.r.m===m);
const all=it.length&&it.every(x=>x.r.d),mk_=it.reduce((a,x)=>a+kc(x.r),0),mp=it.reduce((a,x)=>a+pr(x.r),0);
h+=`<div class="card"><div class="mh"><div><b>${m}</b><div class="muted">${n0(mk_)} kcal · ${n1(mp)} g</div></div><button class="done" data-a="meal" data-m="${m}">${all?"Undo all":"✓ Ate it all"}</button></div>`;
it.forEach(({r,i})=>{const f=food(r.f);
h+=`<div class="row ${r.d?"eaten":""}"><button class="ck ${r.d?"on":""}" data-a="tick" data-i="${i}">${r.d?"✓":""}</button><div class="nm">${esc(r.f)}<small>${f?esc(f.u)+" · "+n0(kc(r))+" kcal · "+n1(pr(r))+" g":"not in Foods"}</small></div>
<div class="st"><button data-a="dec" data-i="${i}">−</button><input type="number" step="0.5" min="0" value="${r.q}" data-a="qty" data-i="${i}"><button data-a="inc" data-i="${i}">+</button></div><button class="x" data-a="del" data-i="${i}">×</button></div>`});
h+=`<select class="add" data-a="add" data-m="${m}"><option value="">+ Add food</option>${S.foods.map(f=>`<option>${esc(f.n)}</option>`).join("")}</select></div>`});
return h}
function weekView(){let sk=0,sp=0,ek=0,mx=S.t.kcal*1.2;DAYS.forEach(d=>{mx=Math.max(mx,tot(d).k)});
let bars="",tr="";DAYS.forEach((d,i)=>{const t=tot(d),e=tot(d,1);sk+=t.k;sp+=t.p;ek+=e.k;
const x=12+i*40,hp=t.k/mx*100,he=e.k/mx*100;
bars+=`<rect x="${x}" y="${110-hp}" width="28" height="${hp}" rx="5" fill="var(--bar)"/><rect x="${x}" y="${110-he}" width="28" height="${he}" rx="5" fill="var(--a1)"/><text x="${x+14}" y="124" text-anchor="middle" font-size="9" fill="var(--muted)">${d}</text>`;
tr+=`<tr><td>${d}</td><td>${n0(e.k)} / ${n0(t.k)}</td><td>${n1(e.p)} / ${n1(t.p)}</td><td>${S.t.weight>0?(t.p/S.t.weight).toFixed(2):"-"}</td></tr>`});
const ty=110-S.t.kcal/mx*100;
return`<h1>This week</h1><div class="card"><div class="muted">Eaten (orange) vs planned (grey), dashed line = target</div><svg viewBox="0 0 300 130" width="100%"><line x1="0" x2="300" y1="${ty}" y2="${ty}" stroke="var(--a2)" stroke-dasharray="4 3"/>${bars}</svg></div>
<div class="card scroll"><table><tr><th>Day</th><th>kcal eaten / planned</th><th>Protein g</th><th>g/kg</th></tr>${tr}<tr><th>Avg planned</th><th>${n0(sk/7)}</th><th>${n1(sp/7)}</th><th></th></tr></table></div>
<div class="card"><b>Targets</b><div class="g3" style="margin-top:8px"><div><label>Calories</label><input type="number" data-a="tg" data-k="kcal" value="${S.t.kcal}"></div><div><label>Protein (g)</label><input type="number" data-a="tg" data-k="protein" value="${S.t.protein}"></div><div><label>Weight (kg)</label><input type="number" data-a="tg" data-k="weight" value="${S.t.weight}"></div></div>
<div class="muted" style="margin:10px 0">Gaining under 0.2 kg a week? Add about 300 kcal (a peanut butter spoon and a banana).</div><button class="btn alt" data-a="reset">${armed?"Tap again to reset everything":"Reset to default plan"}</button></div>`}
function foodsView(){let h=`<h1>Foods</h1><div class="card scroll"><div class="muted" style="margin-bottom:6px">Calories and protein for 1 unit. Edits update every day.</div><table><tr><th>Food</th><th>1 unit =</th><th>kcal</th><th>Prot.</th><th></th></tr>`;
S.foods.forEach((f,i)=>{h+=`<tr><td>${esc(f.n)}</td><td><input value="${esc(f.u)}" data-a="fu" data-i="${i}"></td><td><input type="number" value="${f.k}" data-a="fk" data-i="${i}"></td><td><input type="number" step="0.1" value="${f.p}" data-a="fp" data-i="${i}"></td><td><button class="x" data-a="fdel" data-i="${i}">×</button></td></tr>`});
return h+`</table></div><div class="card"><b>Add a food</b><div class="g3" style="margin-top:8px"><div><label>Name</label><input id="nn"></div><div><label>1 unit =</label><input id="nu"></div><div><label>kcal</label><input id="nk" type="number"></div></div><div class="g3" style="margin-top:8px"><div><label>Protein (g)</label><input id="np" type="number" step="0.1"></div><div></div><div><label>&nbsp;</label><button class="btn" data-a="fadd">Add</button></div></div></div>`}
function render(){const y=scrollY;
$("title").textContent=view==="Today"?(sel===ti?"Today":["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"][sel]):"";
$("date").textContent=view==="Today"?dateOf(sel).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"}):"";
$("view").innerHTML=view==="Today"?todayView():view==="Week"?weekView():foodsView();
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));scrollTo(0,y)}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.v){view=b.dataset.v;armed=false;render();scrollTo(0,0);return}
const a=b.dataset.a,i=+b.dataset.i,rows=S.days[DAYS[sel]];
if(a==="sel"){sel=i;render();return}
if(a==="inc")rows[i].q=Math.round((rows[i].q+0.5)*10)/10;
else if(a==="dec")rows[i].q=Math.max(0,Math.round((rows[i].q-0.5)*10)/10);
else if(a==="del")rows.splice(i,1);
else if(a==="tick")rows[i].d=!rows[i].d;
else if(a==="meal"){const it=rows.filter(r=>r.m===b.dataset.m),all=it.every(r=>r.d);it.forEach(r=>r.d=!all)}
else if(a==="fdel")S.foods.splice(i,1);
else if(a==="fadd"){const n=$("nn").value.trim();if(!n||food(n))return;S.foods.push({n,u:$("nu").value||"1 unit",k:+$("nk").value||0,p:+$("np").value||0})}
else if(a==="reset"){if(!armed){armed=true;render();return}S=defaults();fresh();armed=false}
else return;
save();render()});
document.addEventListener("change",e=>{const t=e.target,a=t.dataset.a;if(!a)return;const i=+t.dataset.i;
if(a==="qty")S.days[DAYS[sel]][i].q=Math.max(0,+t.value||0);
else if(a==="add"){if(!t.value)return;S.days[DAYS[sel]].push({m:t.dataset.m,f:t.value,q:1,d:false})}
else if(a==="tg")S.t[t.dataset.k]=+t.value||0;
else if(a==="fu")S.foods[i].u=t.value;
else if(a==="fk")S.foods[i].k=+t.value||0;
else if(a==="fp")S.foods[i].p=+t.value||0;
else return;
save();render()});
render();
(async()=>{try{if(!window.claude)return;const[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!user)return;
const id=await user.id();if(!id)return;ref=db.collection("data/users/"+id).doc("plan");
const s=await ref.get();
if(s.exists&&s.data().json){S=JSON.parse(s.data().json);fresh();try{localStorage.setItem("gt",JSON.stringify(S))}catch(e){}render()}else await ref.set({json:JSON.stringify(S)});
$("sync").textContent="Synced";
ref.onSnapshot(x=>{if(x.metadata.hasPendingWrites||!x.exists)return;const j=x.data().json;
if(j&&j!==JSON.stringify(S)&&!document.activeElement.matches("input")){S=JSON.parse(j);fresh();render()}})}catch(e){}})();

</script>
</body>
</html>
